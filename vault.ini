# ============================================================================
#  Vault Kit - one config for every command.
#
#  Sections give each command its own namespace. The flat inis this replaces
#  collided: the attachment sync wanted Mode = REPORT|SYNC while the validator
#  wanted FAST|DEEP, and sharing one file meant whichever ran second was
#  misconfigured.
#
#  Anything passed on the command line overrides what is set here.
# ============================================================================

[vault]

# Host names only - no https://, no trailing slash. A full URL is accepted and
# trimmed, since that is what gets pasted from the address bar.
#
# These are two different organisations' vaults and two different accounts. Each
# is logged into separately; `login -Shared` is the opt-in for the rarer case
# where one account really does exist on both sides.
source = your-source-vault.veevavault.com
target = your-target-vault.veevavault.com

# One value moves every command between Vault releases.
api = v26.2


[paths]

# Local folder for logs and reports. The only thing written to disk outside the
# scratch folder used while a file is in flight.
output = .


[documents]

# One document id per line.
ids = documents-ids.txt

# Folder on the TARGET vault's File Staging to upload into. As a Vault Owner or
# System Admin this is an absolute path from the staging root, e.g.
# /u11280389/wave1. A non-Admin gives a path relative to their own user folder.
#
# Run `vault.ps1 probe` to get the target user id and whether the account is
# Admin there. Uploading into Inbox is not neutral - it creates Staged documents,
# and uploading to the staging ROOT is almost never what is wanted, so there is
# no default.
path =


[roles]

# Document Sharing Settings a migration left empty. Documents created through the
# API or Vault Loader do not get the lifecycle's role assignment rules or the
# document type's defaults applied - Veeva confirms this is by design - so a
# migrated document arrives with its roles empty.
#
# One vault: this repairs the TARGET, and never reads the source.

# Which documents to repair. The TARGET id column names them. The same map the
# attachment sync uses, since it is the same set of documents.
map = attachments-map.csv

# A defaults table, written by `roles probe`. Leave empty to take the desired
# state from each document's lifecycle role assignment rules instead, which is
# the default and needs no table.
defaults =


[attachments]
# Old document id -> new document id. Header row, any of comma, tab, semicolon
# or pipe; the delimiter and the column names are both detected.
map = attachments-map.csv

# ---------------------------------------------------------------------------
#  Read by commands not yet ported from legacy\.
# ---------------------------------------------------------------------------

[records]
# Source record id -> destination record id, for object record attachments.
map = records-map.csv
object = submission__v

[limits]
# Refuse to start a download unless this much would remain free, in MB.
reserve = 2048

# How many documents to move at once. 1 keeps the single-threaded path. Above 1
# the command becomes a supervisor: it shards the outstanding ids, runs that many
# copies of itself, and merges their results.
#
# Per-document time is dominated by round trips, not bytes, so this scales close
# to linearly until Vault's burst limit starts throttling. 4 is a safe starting
# point once a sequential run is known good.
workers = 1

# Upload part size in MB. Vault requires at least 5 (except the last part) and
# at most 52. Values outside that are clamped rather than rejected.
part = 25
