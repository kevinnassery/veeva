# ============================================================================
#  Vault Kit - one config for every command.
#
#  Sections give each command its own namespace. The flat inis this replaces
#  collided: the attachment sync wanted Mode = REPORT|SYNC while the validator
#  wanted FAST|DEEP, and sharing one file meant whichever ran second was
#  misconfigured.
#
#  Anything passed on the command line overrides what is set here.
# ============================================================================

[vault]

# Host names only - no https://, no trailing slash. A full URL is accepted and
# trimmed, since that is what gets pasted from the address bar.
source = your-source-vault.veevavault.com
target = your-target-vault.veevavault.com

# One value moves every command between Vault releases.
api = v26.2


[paths]

# Local folder for logs and reports. The only thing written to disk outside the
# scratch folder used while a file is in flight.
output = .


# ---------------------------------------------------------------------------
#  Sections below are read by commands not yet ported from legacy\.
#  They are here so the shape is settled before the ports land.
# ---------------------------------------------------------------------------

[attachments]
# Old document id -> new document id. Header row, any of comma, tab, semicolon
# or pipe; the delimiter and the column names are both detected.
map = attachments-map.csv

[documents]
# One document id per line.
ids = documents-ids.txt

[records]
# Source record id -> destination record id, for object record attachments.
map = records-map.csv
object = submission__v

[limits]
# Refuse to start a download unless this much would remain free, in MB.
reserve = 2048
# Concurrency. 1 until a job is proven.
workers = 1
