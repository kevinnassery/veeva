# ============================================================================
#  Veeva Vault - reconcile document ATTACHMENTS between two vaults
#  THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
#  Given a map of source document id -> target document id, for each pair this
#  lists the attachments on BOTH sides, works out what the target is missing,
#  and delivers only that: download, stage, attach.
#
#  Comparing first is what makes it safe to run again. A document whose
#  attachments are already there costs two listing calls and nothing else.
#
#  Every setting below that also exists in transfer.ini means the same thing and
#  takes the same value - copy them straight across.
# ============================================================================


# ---- What this run should do -----------------------------------------------

# REPORT = compare both sides and report the gap. Changes nothing, downloads
#          nothing. Always start here.
# SYNC   = deliver every missing attachment: download it from the source vault
#          and attach it straight onto the target document.
#
# Both are idempotent - the comparison is redone live on every run, so nothing
# is delivered twice and an interrupted run is simply run again.
Mode = REPORT

# validator.bat has its own setting, since REPORT and SYNC mean nothing to it:
#   DEEP = download both copies and hash them. Proves the bytes. Default.
#   FAST = compare the MD5 Vault already records on each side. No downloads.
ValidateMode = DEEP


# ---- The map ---------------------------------------------------------------

# The map: a header row plus the OLD (source) document id and the NEW (target)
# document id. Put it in the folder you run the .bat from - a relative name here
# resolves against the working directory, and the absolute path that was read is
# printed at the start of every run.
#
# Comma, tab, semicolon or pipe separated - whichever the header actually uses is
# detected, so an export does not need converting first.
#
# Column names are detected from the usual spellings too: source_id/target_id,
# old_id/new_id, sourceDocId/targetDocId and similar. If yours differ the run
# stops and prints the headers it found; name them below rather than editing the
# file.
IdMap = map.csv
MapSourceColumn =
MapTargetColumn =


# ---- Vaults (same values as transfer.ini) ----------------------------------

SourceVaultDNS = your-source-vault.veevavault.com
TargetVaultDNS = your-target-vault.veevavault.com


SeparateCredentials =
SourceSessionId =
TargetSessionId =


# ---- What to look at -------------------------------------------------------

# Optional, and normally left blank: map.csv already says which documents are in
# scope. Point this at a .txt of ids only when you want to narrow a run to part
# of the map - ids not in the map are reported and skipped either way.
IdFile =

OutputRoot = C:\Users\Sarah.Nassery\attachments
WorkDir =

# Cap on DOCUMENTS examined, not attachments. Blank or 0 = all of them.
MaxDocuments = 200


# ---- Matching --------------------------------------------------------------

# Attachments are matched by filename, because that is how Vault matches them
# too: posting a name that already exists creates a new VERSION of it rather
# than a second attachment.
#
# A name that matches on both sides with a DIFFERENT MD5 is reported as DIFFERS
# and left alone. Set this to true to send it anyway, which Vault records as a
# new version. Leave it blank unless you have looked at what differs.
ReplaceDiffering =


# ---- Test run --------------------------------------------------------------

# Stop once this many attachments have actually been reconciled, however many
# documents that took. Use this rather than MaxDocuments for a first look: most
# documents carry no attachments, so a cap of five DOCUMENTS can reconcile
# nothing and prove nothing.
#
# Reconciled means ATTACHED in SYNC - staged and attached, confirmed on the
# target. In REPORT it means that many missing attachments were found.
#
# Test forces single-threaded and attaches one at a time, so the count is exact.
#     attachments.bat -Test              stop after 5
#     attachments.bat -Test -TestCount 20
Test =
TestCount = 5


# ---- Parallelism (same as transfer.ini) ------------------------------------

# Used by REPORT and SYNC. Workers shard by document, so one document's
# attachments stay together on one worker.
#
# REPORT costs two API calls per document - one listing per vault - so 577
# documents take roughly three and a half minutes single-threaded. Workers = 4
# brings that under a minute. It is read-only, so there is no risk in raising it
# for a REPORT run.
#
# Starts at 1 on purpose: get a sequential run right first. The document
# transfer went to 8 only after it was proven, and every bug found along the way
# was easier to see one document at a time.
Workers = 1


# ---- Disk safety (same as transfer.ini) ------------------------------------

ReserveMB = 2048


# ---- Advanced --------------------------------------------------------------


PartSizeMB = 25
ExistingResults = Resume
MaxRetries = 4
