# ============================================================================
#  Veeva Vault - copy document ATTACHMENTS from one vault to another
#  THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
#  For every document id in the list this enumerates that document's
#  attachments, then for each one downloads it from the SOURCE vault, uploads it
#  to the TARGET vault's File Staging, and deletes the local copy.
#
#  The unit of work is the ATTACHMENT, not the document. Most documents have
#  none; some have many. Nothing about the document count tells you the
#  attachment volume - which is why REPORT exists.
# ============================================================================


# ---- What this run should do -----------------------------------------------

# REPORT   = list every attachment and total the size. Moves nothing, and never
#            contacts the target vault.
# TRANSFER = download each attachment and upload it to the target staging.
#
# Always start at REPORT.
Mode = REPORT


# ---- Source vault ----------------------------------------------------------

SourceVaultDNS = mallinckrodt-rim.veevavault.com


# ---- Target vault (TRANSFER only) ------------------------------------------

# The vault DNS, not the sandbox display name.
TargetVaultDNS = sb-endo-endo-rim-sbx.veevavault.com

# Folder on the TARGET vault's File Staging. Each attachment lands at
#     <TargetPath>/<source doc id>/attachments/<attachment id>/<filename>
# The attachment id is in the path because one document can carry two
# attachments with the same filename, which the document folder alone would not
# keep apart.
TargetPath = /u11280389


# ---- Credentials -----------------------------------------------------------

# One prompt, used for both vaults. Leave the session ids blank: parallel mode
# needs a real login so each worker can re-authenticate when its session expires.
SeparateCredentials =
SourceSessionId =
TargetSessionId =


# ---- What to look at -------------------------------------------------------

# The same id list the document transfer uses.
IdFile = sourcedocids.txt

OutputRoot = C:\Users\Sarah.Nassery\attachments

# Blank = a attachment-work folder under OutputRoot. One file at a time lives
# here and is deleted as soon as it has uploaded.
WorkDir =

# Cap on DOCUMENTS examined, not attachments. Blank or 0 = all of them.
# Start with a few hundred in REPORT to see how common attachments are.
MaxDocuments = 200


# ---- Parallelism -----------------------------------------------------------

# TRANSFER only - REPORT is one cheap call per document and stays sequential.
# Workers shard by document, so a document's attachments stay on one worker.
Workers = 8


# ---- Disk safety -----------------------------------------------------------

ReserveMB = 2048


# ---- Advanced --------------------------------------------------------------

PartSizeMB = 25
ExistingResults = Resume
MaxRetries = 4


# ============================================================================
#  NOT DONE HERE
#
#  This gets attachment files onto the target vault's File Staging. Attaching
#  them to documents in that vault is a separate step:
#
#      POST /api/v26.2/objects/documents/attachments/batch
#      CSV: document_id__v, filename__v, file      (max 500 per batch)
#
#  It needs the TARGET document id for each source document, and nothing in this
#  repo builds that mapping yet. attachment-results.csv records the source
#  document id and the staged path for every file, which is the half of that
#  mapping we can produce.
# ============================================================================
