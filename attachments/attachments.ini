# ============================================================================
#  Veeva Vault - reconcile document ATTACHMENTS between two vaults
#  THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
#  Given a map of source document id -> target document id, for each pair this
#  lists the attachments on BOTH sides, works out what the target is missing,
#  and delivers only that: download, stage, attach.
#
#  Comparing first is what makes it safe to run again. A document whose
#  attachments are already there costs two listing calls and nothing else.
#
#  Every setting below that also exists in transfer.ini means the same thing and
#  takes the same value - copy them straight across.
# ============================================================================


# ---- What this run should do -----------------------------------------------

# REPORT = compare both sides and report the gap. Changes nothing, downloads
#          nothing. Always start here.
# SYNC   = deliver every missing attachment: download, stage, attach.
# ATTACH = attach files an earlier interrupted SYNC already staged, then stop.
Mode = REPORT


# ---- The map ---------------------------------------------------------------

# CSV with a header row, mapping the OLD (source) document id to the NEW
# (target) document id. Column names are detected from the usual spellings -
# source_id/target_id, old_id/new_id, sourceDocId/targetDocId and similar. If
# yours are named differently the run stops and tells you what it found; set
# them below rather than renaming the file.
IdMap = docidmap.csv
MapSourceColumn =
MapTargetColumn =


# ---- Vaults (same values as transfer.ini) ----------------------------------

SourceVaultDNS = mallinckrodt-rim.veevavault.com
TargetVaultDNS = sb-endo-endo-rim-sbx.veevavault.com

# Staging folder on the TARGET vault. Each file lands at
#     <TargetPath>/<TARGET doc id>/attachments/<source attachment id>/<filename>
# The attachment id is in the path because one document can carry two
# attachments with the same name, which the document folder alone would not
# keep apart.
TargetPath = /u11280389

SeparateCredentials =
SourceSessionId =
TargetSessionId =


# ---- What to look at -------------------------------------------------------

# Optional. Present, it narrows the run to these ids; absent, every document in
# the map is checked. Ids not in the map are reported and skipped.
IdFile = sourcedocids.txt

OutputRoot = C:\Users\Sarah.Nassery\attachments
WorkDir =

# Cap on DOCUMENTS examined, not attachments. Blank or 0 = all of them.
MaxDocuments = 200


# ---- Matching --------------------------------------------------------------

# Attachments are matched by filename, because that is how Vault matches them
# too: posting a name that already exists creates a new VERSION of it rather
# than a second attachment.
#
# A name that matches on both sides with a DIFFERENT MD5 is reported as DIFFERS
# and left alone. Set this to true to send it anyway, which Vault records as a
# new version. Leave it blank unless you have looked at what differs.
ReplaceDiffering =


# ---- Parallelism (same as transfer.ini) ------------------------------------

# SYNC only. Workers shard by document, so one document's attachments stay
# together on one worker.
Workers = 8


# ---- Disk safety (same as transfer.ini) ------------------------------------

ReserveMB = 2048


# ---- Advanced --------------------------------------------------------------

# Attachments per bulk attach call. Vault's ceiling is 500.
AttachBatchSize = 500

PartSizeMB = 25
ExistingResults = Resume
MaxRetries = 4
