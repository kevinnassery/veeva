# ============================================================================
#  Veeva Vault - copy document source files from one vault to another
#  THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
#  For each document id it downloads the source file straight from the SOURCE
#  vault, uploads it to the TARGET vault's File Staging, then deletes the local
#  copy. Nothing is ever written to the SOURCE vault's File Staging, so there is
#  nothing to clean up there.
#
#  Only one file is on local disk at a time, so the disk you need is the size of
#  the largest single document - not the size of the whole set.
# ============================================================================


# ---- Source vault ----------------------------------------------------------

SourceVaultDNS = your-source-vault.veevavault.com


# ---- Target vault ----------------------------------------------------------

# The vault DNS, NOT the sandbox's display name. It is the host in your browser's
# address bar when you are logged into that vault - the part before /ui/.
TargetVaultDNS =

# Folder on the TARGET vault's File Staging to upload into. As a Vault Owner or
# System Admin this is an absolute path from the staging root; a non-Admin gives
# a path relative to their own user folder. probe.bat reports which you are.
#
# Each document lands in its OWN subfolder named for its source document id:
#     <TargetPath>/<source doc id>/<original filename>
# Two documents named "Cover Letter.pdf" therefore cannot overwrite each other.
#
# Uploading into Inbox is not neutral - it creates Staged documents. Use a plain
# working folder unless that is what you want.
#
# Set to the target vault's user folder root, so each document lands at
#     /u11280389/<source doc id>/<original filename>
# The per-document folder is created by the script; no wave subfolder is used.
#
# This is an ABSOLUTE path from the staging root, which is correct for a Vault
# Owner or System Admin on the TARGET vault. If that account is non-Admin there,
# staging paths are relative to its own folder and this should be just a slash.
# probe.bat pointed at the target reports which, in section [1].
TargetPath = /u11280389


# ---- Credentials -----------------------------------------------------------

# The same account exists on both vaults, so you are prompted ONCE and that login
# is used for both. Set this to true only if the two sides need different logins.
SeparateCredentials =

# Paste session ids here to skip the login entirely. Rarely needed.
SourceSessionId =
TargetSessionId =


# ---- What to move ----------------------------------------------------------

# A .txt of document ids, one per line. Same file the extractor uses.
IdFile = documents-ids.txt

# Local folder for the results CSV and run log.
OutputRoot = C:\Users\Sarah.Nassery\sourcedocuments

# Where the in-flight file lands. Blank = a transfer-work folder under OutputRoot.
# One file at a time lives here and is deleted as soon as it has uploaded.
WorkDir =

# Cap on how many documents to move. Blank or 0 = all of them, which is the
# default. To test first, put a number here - transfer.bat -MaxDocuments 2 does
# the same thing for one run without editing this file.
#
# The cap applies to what is still OUTSTANDING, not to the whole list, so
# repeated capped runs walk forward instead of retrying the same documents.
MaxDocuments =


# ---- Parallelism -----------------------------------------------------------

# How many documents to move at once. 1 is the original single-threaded path.
#
# Above 1 this process becomes a supervisor: it shards the outstanding ids,
# launches that many copies of itself in single-worker mode, and merges their
# results into transfer-results.csv at the end. Per-worker logs are kept under
# OutputRoot\transfer-workers\ for diagnosis.
#
# Per-document time is dominated by round trips rather than bytes, so this
# scales close to linearly until Vault's burst limit starts throttling - the
# workers back off on their own when it does.
#
# Local disk use becomes Workers x the largest single file, still nowhere near
# the size of the set.
#
# Parallel mode needs a username and password, NOT a pasted session id: each
# worker authenticates for itself so it can re-authenticate when its session
# expires. Leave SourceSessionId and TargetSessionId blank.
Workers = 8


# ---- Disk safety -----------------------------------------------------------

# Refuse to start a download unless this much free space would be left afterwards.
# The run stops cleanly rather than filling the volume. 2048 = 2GB.
ReserveMB = 2048


# ---- Advanced - sensible defaults ------------------------------------------

# Upload part size in MB. Vault requires at least 5 and at most 52.
PartSizeMB = 25

# Prompt / Resume / Restart, for when transfer-results.csv is already present.
# Resume by default: a full run is long enough that it will be interrupted at
# some point, and Prompt would leave it sitting on a keypress instead of
# carrying on. Restart rotates the old results aside rather than deleting them.
ExistingResults = Resume

MaxRetries = 4
