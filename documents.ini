# ============================================================================
#  Veeva Vault - Library bulk action from a VQL query
#  THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
#  Both Invoke-VaultDocumentAction.ps1 and Run-Documents.bat read this file,
#  so there is never a second copy to keep in sync. Anything passed explicitly
#  on the command line overrides what is set here.
#
#  Format: KEY = VALUE, one per line. Lines starting with # are comments.
#
#  This replaces the Library UI flow: saved view -> ... -> Perform Bulk Action
#  -> Refine Selection -> Choose Action -> Edit Details. The saved view itself
#  is not reachable over the API, so its filters are rebuilt here as a query.
# ============================================================================


# ---- Required --------------------------------------------------------------

# Vault host name. No https://, no trailing slash.
VaultDNS = mallinckrodt-rim.veevavault.com

# Local folder for the CSV reports and run log. The only thing written to disk.
OutputRoot = C:\Users\Sarah.Nassery


# ---- What this run should do -----------------------------------------------

# REPORT = run the query, write documents.csv plus document-fields.csv and
#          document-types.csv for reference, size the export, then stop.
#          Changes nothing.
# DRYRUN = do everything except the write. Rehearses EXPORT, or UPDATE if
#          SetFields is set.
# UPDATE = bulk-set the SetFields values on every matched document.
# EXPORT = export every matched document to File Staging.
#
# Always start at REPORT. Look at documents.csv and confirm it is the same set
# the saved view shows before going any further.
MODE = REPORT

# Withhold every write, whatever MODE says. Same as passing -WhatIf, but it
# survives a double-click. Use it to rehearse an EXPORT without setting MODE.
DryRun =

# Cap on how many documents to touch at all. Blank or 0 = no cap.
# Set this to 10 for the first real UPDATE run, confirm those ten in the UI,
# then clear it.
MaxDocuments = 10

# Optional sampling. Blank or 0 processes every document found. A whole number
# 1-100 processes only that percentage of them, chosen at random. Each run draws
# a NEW random sample; it is not a fixed subset. Anything already SUCCESS is
# still skipped and earlier results are kept, so sampling repeatedly is safe.
SamplePercent =

# What to do when this run's CSV reports are already in OutputRoot from an
# earlier run.
#   Prompt  = ask before starting (default). Shows how many rows and how many
#             succeeded, then lets you decide. Non-interactive hosts continue.
#   Resume  = keep them. Anything already SUCCESS is skipped, its row preserved.
#   Restart = rotate them aside and begin fresh. The old file is RENAMED, never
#             deleted: document-results.csv -> document-results-<when>.csv
ExistingResults = Prompt


# ---- Vault settings --------------------------------------------------------

# API version. One value moves the whole script between releases.
ApiVersion = v26.2

# Vault API session id. THE ONLY PLACE A SESSION ID IS SET.
# Leave blank to log in with username/password (the script manages the session,
# including re-authenticating if it expires mid-run). Paste a session id here to
# reuse one you already hold.
SessionId =


# ---- Which documents -------------------------------------------------------
#
# Simplest path, and the one the extraction work uses: a local .txt of document
# ids, one per line. When this is set NOTHING is queried and no type filtering
# happens - the file is the document list.
#
# The file is read tolerantly: an "id" header, blank lines, #-comments, quotes,
# a trailing comma and duplicates are all handled. A line that is not a number
# is skipped with a warning rather than stopping the run.
#
#     id
#     771
#     772
#
IdFile = sourcedocids.txt


# Everything below is only used when IdFile is BLANK, i.e. when you want the
# script to find the documents itself instead of being handed a list.

# Product filter. A product record id (00P...) is exact and always safe:
#     SELECT id, name__v FROM product__v
# Acthar in mallinckrodt-rim is 00P000000000310 (probe run 2026-08-26).
Product =
ProductField = product__v

# Document types to KEEP, comma separated, exactly as the UI shows them. This is
# the allowlist and it wins over ExcludeTypes. Safer of the two: a type added to
# the vault later stays out by default instead of being swept in.
# Builds  type__v CONTAINS ('Clinical', 'Labeling', ...)
IncludeTypes =

# The inverse. Ignored if IncludeTypes is set. VQL has no NOT IN, so this builds
# a chain of type__v != '...' AND ...
ExcludeTypes =

# Anything else, appended to the WHERE clause verbatim. Your escaping, your risk.
#
# binder__v IS queryable in mallinckrodt-rim (Boolean, queryable=True - probe run
# 2026-08-26), so the UI's "Binder: No" filter is:
#     Where = binder__v = false
#
# Subtypes also go here. The UI's "Document Types" filter mixes types and
# subtypes, but IncludeTypes/ExcludeTypes only build type__v clauses - a subtype
# has to be written as subtype__v != 'Label'. Section [4] of the probe says
# which is which.
Where =

# Fields to pull back into documents.csv. id is always included. size__v is what
# the size estimate uses - drop it and REPORT can still run, it just cannot tell
# you how much data the export would move.
SelectFields = id, name__v, type__v, size__v, major_version_number__v, minor_version_number__v

# Or bypass the filters and supply the whole query yourself. Wins over them,
# loses to IdFile.
Vql =


# ---- UPDATE: what to write -------------------------------------------------
#
# name=value pairs separated by | (a pipe, because a semicolon after a space
# starts a comment in this file). A value of null clears the field.
#     SetFields = product__v=00P1110
#     SetFields = product__v=00P1110|country__v=00C0001
#
# Only fields with editable:true in document-fields.csv can be written, and only
# the latest version of each document is updated. Both are checked against the
# vault's field metadata before the first batch, so a bad name stops the run
# rather than producing a thousand per-row errors.
SetFields =

# REPEATING FIELDS. product__v in mallinckrodt-rim is repeating (multi-value),
# meaning it holds a SET of values. Writing one value to it may REPLACE
# everything already on the document rather than adding to it. The script
# refuses to write a repeating field unless this is true.
#
# Before setting it: update ONE document with MaxDocuments = 1, note its values
# beforehand, and check what Vault actually did.
AllowRepeatingFields =


# ---- EXPORT: what to include -----------------------------------------------

# Source files. Usually what you want.
ExportSource = true

# Viewable renditions as well.
ExportRenditions = false

# Every version rather than just the latest.
ExportAllVersions = false

# Extracted document TEXT. This is the one to turn on if "extraction" means
# getting the text out rather than the files.
ExportText = false


# ---- Advanced - sensible defaults, change only if you have a reason ---------

# Documents per Update Multiple Documents call. Vault's own ceiling is 1,000 and
# it rejects more - the same 1,000 the UI offers as "First 1000 Documents".
# A view matching 5,200 documents is six batches, not one.
BatchSize = 1000

# Documents per query page. 1,000 is the maximum.
PageSize = 1000

JobTimeoutMinutes = 120
JobPollSeconds    = 20
MaxRetries        = 4
