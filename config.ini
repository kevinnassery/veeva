# ============================================================================
#  Veeva Vault RIM - Submissions Archive bulk import
#  THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
#  Both Import-VaultSubmissions.ps1 and Run-Import.bat read this file, so
#  there is never a second copy to keep in sync. Anything passed explicitly
#  on the command line overrides what is set here.
#
#  Format: KEY = VALUE, one per line. Lines starting with # are comments.
# ============================================================================


# ---- Required --------------------------------------------------------------

# Vault host name. No https://, no trailing slash.
VaultDNS   = mycompany-rim.veevavault.com

# Folder holding the bulk download. This script only ever READS from it -
# nothing is written, moved, renamed or deleted here.
SourceRoot = D:\SubmissionDownloads

# Where the manifest, results CSV and log are written.
# Must NOT be inside SourceRoot.
OutputRoot = D:\ImportRun


# ---- What this run should do -----------------------------------------------

# MANIFEST = scan the download and write manifest.csv, then stop. No Vault calls.
# DRYRUN   = authenticate and resolve every submission id, but upload/import nothing.
# IMPORT   = do it for real.
MODE = MANIFEST


# ---- Vault settings --------------------------------------------------------

# API version. One value moves the whole script between releases.
ApiVersion = v26.2

# Vault API session id. THE ONLY PLACE A SESSION ID IS SET.
# Leave blank for normal use - the script logs in and manages the session
# itself, including re-authenticating if it expires mid-run. Set this only if
# you already hold a session and want to reuse it.
SessionId =

# Staging root for Submissions Archive imports. Change only if your Vault differs.
StagingRoot = /SubmissionsArchive


# ---- How archives map to submission records --------------------------------
# Set ONE of these, or none to fall back to a VQL lookup on LookupField.

# Vault's own export summary, from the <App>-<Sub>-export-summary.zip that
# Bulk Submission Export produces. Best option: the mapping is derived for you.
ExportResultsCsv =

# The hand-filled mapping sheet produced by MODE = MANIFEST.
Manifest =

# Set to true when each file is named for its record id, e.g. 00S000000000001.zip
NameIsSubmissionId = false

# Force the column names in ExportResultsCsv if auto-detection picks wrong.
IdColumn =
PathColumn =


# ---- Advanced - sensible defaults, change only if you have a reason ---------

# VQL field used to resolve a submission when no id is supplied.
LookupField = name__v

# Used when a manifest row leaves DossierFormatId blank.
DefaultDossierFormatId =

# Which files count as submission archives.
Include = *.zip, *.tar.gz, *.tgz

# Folders the script must never write into.
ProtectedPath = %USERPROFILE%\Documents\wave1

PartSizeMB        = 50
JobTimeoutMinutes = 120
JobPollSeconds    = 20
MaxRetries        = 4
