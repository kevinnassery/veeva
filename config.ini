# ============================================================================
#  Veeva Vault RIM - Submissions Archive bulk import
#  THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
#  Both Import-VaultSubmissions.ps1 and Run-Import.bat read this file, so
#  there is never a second copy to keep in sync. Anything passed explicitly
#  on the command line overrides what is set here.
#
#  Format: KEY = VALUE, one per line. Lines starting with # are comments.
#
#  The dossiers are already on File Staging, under the Submissions Archive
#  root. Nothing is moved, downloaded or uploaded - each dossier is imported
#  from where it sits.
# ============================================================================


# ---- Required --------------------------------------------------------------

# Vault host name. No https://, no trailing slash.
VaultDNS = sb-endo-endo-rim-sbx.veevavault.com

# File Staging folder holding the dossiers, under the Submissions Archive root.
# Everything matching Include below (recursively) is imported.
SourceStagingPath = /SubmissionsArchive/e15713S

# Local folder for the results CSV and run log. The only thing written to disk.
OutputRoot = C:\Users\Sarah.Nassery


# ---- What this run should do -----------------------------------------------

# MANIFEST = list the dossiers, write manifest.csv, then stop. Nothing imported.
# DRYRUN   = resolve every submission id, but import nothing.
# IMPORT   = do it for real.
MODE = MANIFEST


# ---- Vault settings --------------------------------------------------------

# API version. One value moves the whole script between releases.
ApiVersion = v26.2

# Vault API session id. THE ONLY PLACE A SESSION ID IS SET.
# Leave blank to log in with username/password (the script manages the session,
# including re-authenticating if it expires mid-run). Paste a session id here to
# reuse one you already hold.
SessionId =


# ---- How dossiers map to submission records --------------------------------

# Staging path of export_results.csv. Leave blank and the script finds it under
# SourceStagingPath - the export writes it next to the dossiers, read in place.
ExportResultsCsv =

# Optional hand-filled mapping sheet produced by MODE = MANIFEST. Local path.
# Overrides export_results.csv for any file name it lists.
Manifest =

# Set true when each dossier is named for its record id, e.g. 00S000000000001.zip
NameIsSubmissionId = false

# Force the column names in export_results.csv if auto-detection picks wrong.
IdColumn =
PathColumn =


# ---- Advanced - sensible defaults, change only if you have a reason ---------

# VQL field used to resolve a submission when no id is available.
LookupField = name__v

# Used when a manifest row leaves DossierFormatId blank.
DefaultDossierFormatId =

# Which staged files count as dossiers.
Include = *.zip, *.tar.gz, *.tgz

JobTimeoutMinutes = 120
JobPollSeconds    = 20
MaxRetries        = 4
