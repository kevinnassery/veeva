# ============================================================================
#  Veeva Vault RIM - Submissions Archive bulk import
#  THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
#  Both Import-VaultSubmissions.ps1 and Run-Import.bat read this file, so
#  there is never a second copy to keep in sync. Anything passed explicitly
#  on the command line overrides what is set here.
#
#  Format: KEY = VALUE, one per line. Lines starting with # are comments.
#
#  Nothing is downloaded or uploaded. The dossiers are already on File
#  Staging; this tool relocates them into /SubmissionsArchive and imports.
# ============================================================================


# ---- Required --------------------------------------------------------------

# Vault host name. No https://, no trailing slash.
VaultDNS = mycompany-rim.veevavault.com

# File Staging folder holding the export. This is where Bulk Submission Export
# left its output - look for the job id folder under your user folder:
#     /u{YourUserID}/Submissions Archive Export/{JobID}
SourceStagingPath = /u5678/Submissions Archive Export/727301

# Local folder for the results CSV and run log. The only thing written to disk.
OutputRoot = D:\ImportRun


# ---- What this run should do -----------------------------------------------

# MANIFEST = list the export, write manifest.csv, then stop. Nothing is moved.
# DRYRUN   = resolve every submission id and show the moves, but change nothing.
# IMPORT   = do it for real.
MODE = MANIFEST


# ---- Vault settings --------------------------------------------------------

# API version. One value moves the whole script between releases.
ApiVersion = v26.2

# Vault API session id. THE ONLY PLACE A SESSION ID IS SET.
# Leave blank for normal use - the script logs in and manages the session
# itself, including re-authenticating if it expires mid-run.
SessionId =

# Import target root, using the /SubmissionsArchive/<application>/<submission>
# convention. Archives (.zip / .tar.gz) can ONLY be imported from here - Vault
# does not support importing them from a user folder, which is why the dossiers
# have to be relocated out of the export folder first.
StagingRoot = /SubmissionsArchive

# Return each dossier to its original export path after a successful import.
# The File Staging API has no copy operation, only move, so without this the
# relocation is one-way. Costs a second async job per submission.
MoveBack = false


# ---- How dossiers map to submission records --------------------------------

# Staging path of export_results.csv. Leave blank and the script finds it
# under SourceStagingPath - the export writes it next to the dossiers, and it
# is read in place, so you never need a local copy.
ExportResultsCsv =

# Optional hand-filled mapping sheet produced by MODE = MANIFEST. Local path.
# Overrides export_results.csv for any file name it lists.
Manifest =

# Set true when each dossier is named for its record id, e.g. 00S000000000001.zip
NameIsSubmissionId = false

# Force the column names in export_results.csv if auto-detection picks wrong.
IdColumn =
PathColumn =


# ---- Advanced - sensible defaults, change only if you have a reason ---------

# VQL field used to resolve a submission when no id is available.
LookupField = name__v

# Used when a manifest row leaves DossierFormatId blank.
DefaultDossierFormatId =

# Which staged files count as dossiers.
Include = *.zip, *.tar.gz, *.tgz

JobTimeoutMinutes = 120
JobPollSeconds    = 20
MaxRetries        = 4
